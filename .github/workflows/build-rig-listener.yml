# Builds standalone rig-listener executables for Windows, Mac, and Linux.
# Runs on release creation, or manually — give the manual run a release tag
# (e.g. v26.8.0) and the binaries are attached to that existing release.
#
# Each OS runner installs native serialport bindings for its platform,
# then @yao-pkg/pkg bundles everything into a single executable.

name: Build Rig Listener

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the binaries to (e.g. v26.8.0); leave blank to only build'
        required: false
        default: ''
  release:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'accius/openhamclock'
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: node18-win-x64
            output: rig-listener-win-x64.exe
            artifact: rig-listener-win-x64

          # Intel Mac. macos-13 was retired 2025-12-04 and left this job queued
          # for 24 h until GitHub cancelled it, which sank every release's
          # rig-listener assets from 26.4.0 on. macos-15-intel is the last
          # x86_64 image GitHub offers, available until August 2027.
          - os: macos-15-intel
            target: node18-macos-x64
            output: rig-listener-mac-x64
            artifact: rig-listener-mac-x64

          - os: macos-latest # Apple Silicon
            target: node18-macos-arm64
            output: rig-listener-mac-arm64
            artifact: rig-listener-mac-arm64

          - os: ubuntu-latest
            target: node18-linux-x64
            output: rig-listener-linux-x64
            artifact: rig-listener-linux-x64

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: rig-listener

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 18

      # Install deps — this downloads platform-specific serialport prebuilds
      - run: npm install

      # Build standalone executable with pkg
      - name: Build executable
        run: npx --yes @yao-pkg/pkg . --target ${{ matrix.target }} --output dist/${{ matrix.output }} --compress GZip

      # Make executable on unix
      - name: Set permissions
        if: runner.os != 'Windows'
        run: chmod +x dist/${{ matrix.output }}

      # Upload as artifact
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: rig-listener/dist/${{ matrix.output }}

  # Attach all binaries to the GitHub release
  attach-to-release:
    if: github.repository == 'accius/openhamclock' && (github.event_name == 'release' || inputs.tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          # On the release event this is the triggering release; on a manual
          # run it is the tag typed into the dispatch form.
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
          files: artifacts/**/*
