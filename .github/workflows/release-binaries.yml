# Builds standalone OpenHamClock executables (no Node.js needed to run them)
# and attaches them to the GitHub Release.
#
# Triggered when a release is published (same event that builds the Docker
# image), or manually from the Actions tab — a manual run leaves the archives
# as workflow artifacts without touching any release.
#
# The server has no native modules, so one Linux runner cross-builds the
# Linux, Raspberry Pi and Windows executables. macOS binaries are built on a
# macOS runner so they can be ad-hoc code-signed (Apple Silicon refuses to
# launch unsigned binaries).

name: Release Binaries

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'accius/openhamclock' || github.repository == 'gmcdole/PRC-openhamclock'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: linux-x64,linux-arm64,linux-armv7,win-x64
          - os: macos-latest
            targets: macos-arm64,macos-x64
    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # prebuild fetches the P.533 WASM from the wasm-latest release
      - name: Build frontend
        run: npm run build

      # Fonts + Leaflet bundled so the executable makes no CDN requests on load
      - name: Download vendor assets
        run: bash scripts/vendor-download.sh || echo "vendor assets skipped — server falls back to CDN"

      # Club build: the bundled .env.example becomes each member's .env on first
      # launch, so K1PRC / DM34 is the default station. A member's own settings
      # still override it, and an existing .env is never overwritten.
      - name: Club station defaults (K1PRC)
        if: github.repository == 'gmcdole/PRC-openhamclock'
        run: |
          sed -i.bak -e 's/^CALLSIGN=.*/CALLSIGN=K1PRC/' -e 's/^LOCATOR=.*/LOCATOR=DM34/' .env.example
          rm .env.example.bak
          grep -E '^(CALLSIGN|LOCATOR)=' .env.example

      - name: Build executables
        run: node scripts/build-binaries.js --targets ${{ matrix.targets }}

      - uses: actions/upload-artifact@v7
        with:
          name: openhamclock-binaries-${{ matrix.os }}
          path: release/openhamclock-*
          retention-days: 30

  attach-to-release:
    if: (github.repository == 'accius/openhamclock' || github.repository == 'gmcdole/PRC-openhamclock') && github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    name: Attach to release

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          ls -la
          sha256sum openhamclock-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/openhamclock-*
            artifacts/SHA256SUMS.txt
